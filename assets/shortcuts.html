<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>键盘快捷键</title>
  <script>const __theme=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.colorScheme=__theme?__theme:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')</script>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei UI",sans-serif;background:var(--chrome-bg);color:var(--chrome-text)}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden}
    main{height:100%;display:flex;flex-direction:column;padding:22px 24px 18px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}h1{font-size:20px;margin:0;font-weight:650}
    .search{height:38px;border:1px solid var(--chrome-border-strong);border-radius:var(--chrome-radius-sm);display:flex;align-items:center;gap:9px;padding:0 14px;margin-bottom:13px;background:var(--chrome-bg);transition:border-color .14s,box-shadow .14s}
    .search:focus-within{border-color:var(--focus-ring,var(--chrome-text-faint));box-shadow:0 0 0 2px color-mix(in srgb,var(--focus-ring,var(--chrome-text-muted)) 25%,transparent)}.search img{width:14px;filter:invert(72%)}input{width:100%;border:0;outline:0;background:transparent;color:var(--chrome-text);font:inherit}input::placeholder{color:var(--chrome-text-faint)}
    #list{overflow:auto;padding-right:4px;scrollbar-color:var(--chrome-surface-3) transparent}.section{margin-top:14px}.section:first-child{margin-top:4px}h2{font-size:14px;margin:0 0 8px;color:var(--chrome-text)}
    .row{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:7px 0;color:var(--chrome-text-muted);font-size:14px}.keys{display:flex;gap:5px;flex:none}kbd{font:12px/1.7 "Segoe UI",sans-serif;color:var(--chrome-text);background:var(--chrome-surface-2);border:1px solid var(--chrome-border-strong);border-radius:5px;padding:0 7px}
    .empty{padding:42px 0;text-align:center;color:var(--chrome-text-faint)}
    :root[data-color-scheme="light"]{color-scheme:light;background:var(--chrome-bg);color:var(--chrome-text)}
    :root[data-color-scheme="light"] .search img{filter:brightness(0);opacity:.6}
  </style>
</head>
<body><main><header><h1 id="title">键盘快捷键</h1></header><label class="search"><img src="shell-icons/magnifying-glass.svg" alt=""><input id="query" type="search" autocomplete="off" placeholder="搜索快捷键"></label><div id="list" role="region" aria-live="polite" aria-label="快捷键列表"></div></main>
<script>
  const api=window.dshShell;let data;const list=document.getElementById('list');const query=document.getElementById('query');
  document.addEventListener('keydown',event=>{if(event.key==='Escape')window.close()});
  const parts=value=>value.replaceAll('Cmd','⌘').replaceAll('Ctrl','Ctrl').split('+');
  function render(){const q=query.value.trim().toLowerCase();const matched=data.actions.filter(a=>a.acceleratorLabel&&(a.label+' '+a.keywords+' '+a.acceleratorLabel).toLowerCase().includes(q));list.replaceChildren();for(const menu of data.menus){const rows=matched.filter(a=>a.menu===menu.id);if(!rows.length)continue;const section=document.createElement('section');section.className='section';section.innerHTML='<h2></h2>';section.querySelector('h2').textContent=menu.label;for(const action of rows){const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.textContent=action.label;const keys=document.createElement('span');keys.className='keys';for(const key of parts(action.acceleratorLabel)){const kbd=document.createElement('kbd');kbd.textContent=key;keys.append(kbd)}row.append(label,keys);section.append(row)}list.append(section)}if(!list.childElementCount){const empty=document.createElement('div');empty.className='empty';empty.textContent=data.locale.startsWith('zh')?'未找到匹配的快捷键':'No matching shortcuts';list.append(empty)}}
  function applyBootstrap(value){data=value;const zh=value.locale.startsWith('zh');document.documentElement.lang=value.locale;document.documentElement.dataset.colorScheme=value.colorScheme;document.documentElement.style.colorScheme=value.colorScheme;document.title=zh?'键盘快捷键':'Keyboard Shortcuts';document.getElementById('title').textContent=document.title;query.placeholder=zh?'搜索快捷键':'Search shortcuts';render()}
  query.addEventListener('input',render);api.getBootstrap().then(value=>{applyBootstrap(value);query.focus()});api.onBootstrap(applyBootstrap);
</script></body></html>
