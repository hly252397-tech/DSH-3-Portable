<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DSH Codex Desktop</title>
  <link rel="icon" type="image/png" href="./icon.png">
  <script>const __theme=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.colorScheme=__theme?__theme:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')</script>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: var(--chrome-bg);
      color: var(--chrome-text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fade-in .45s ease both;
    }
    .status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .whale-mark {
      position: relative;
      width: clamp(232px, min(26vw, 36vh), 316px);
      aspect-ratio: 4 / 3;
      flex: none;
      contain: layout paint size;
      isolation: isolate;
      pointer-events: none;
    }
    .whale-mark::before {
      position: absolute;
      z-index: -1;
      inset: 15% 5% 6%;
      content: "";
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse at 28% 28%,
          color-mix(in srgb, var(--accent, var(--dsh-accent)) 18%, transparent),
          transparent 52%
        ),
        radial-gradient(
          ellipse at 63% 68%,
          color-mix(in srgb, var(--chrome-text) 6%, transparent),
          transparent 64%
        );
      filter: blur(17px);
      opacity: .34;
      transform: scale(.91);
      animation: whale-aura 6.8s ease-in-out infinite;
    }
    .whale-mark::after {
      position: absolute;
      z-index: -1;
      right: 14%;
      bottom: 10%;
      left: 17%;
      height: 1px;
      content: "";
      background: linear-gradient(
        90deg,
        transparent,
        color-mix(in srgb, var(--accent, var(--dsh-accent)) 32%, transparent) 34%,
        color-mix(in srgb, var(--chrome-text) 16%, transparent) 56%,
        transparent
      );
      filter: blur(.4px);
      opacity: .18;
      transform: scaleX(.72);
    }
    .whale-fallback,
    .icon {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
    .whale-fallback {
      padding: 10px 7px 7px;
      object-fit: contain;
      opacity: .32;
      filter: invert(1) drop-shadow(0 0 13px color-mix(in srgb, var(--accent, var(--dsh-accent)) 34%, transparent));
      transition: opacity .22s ease;
    }
    .icon {
      opacity: 0;
      transition: opacity .32s ease;
    }
    .whale-mark[data-rendered="true"] .icon {
      opacity: 1;
    }
    .whale-mark[data-rendered="true"] .whale-fallback {
      opacity: 0;
    }
    .progress {
      --startup-progress: 0;
      position: relative;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      color: var(--chrome-text);
    }
    .progress::before,
    .progress::after {
      content: "";
      position: absolute;
      border-radius: inherit;
    }
    .progress::before {
      inset: 0;
      background: conic-gradient(
        var(--accent, #6ea8ff) calc(var(--startup-progress) * 1%),
        color-mix(in srgb, var(--chrome-text) 12%, transparent) 0
      );
      transition: background .2s ease;
    }
    .progress::after {
      inset: 3px;
      background: var(--chrome-bg);
    }
    .progress[hidden] {
      display: none;
    }
    #progressValue {
      position: relative;
      z-index: 1;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: .02em;
    }
    #msg {
      margin: 0;
      max-width: 420px;
      color: var(--chrome-text-muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      white-space: pre-wrap;
    }
    /* 实测计数每约 100ms 刷新一次，刻意放在 aria-live 区域之外并标记 aria-hidden：
       进度语义由 #startupProgress 的 aria-valuenow 承担，避免读屏器被高频文本更新刷屏。 */
    #detail {
      margin: 0;
      min-height: 1.2em;
      max-width: 420px;
      color: var(--chrome-text-muted);
      opacity: .75;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    #detail[hidden] { display: none; }
    :root[data-color-scheme="light"]{color-scheme:light}
    :root[data-color-scheme="light"] body{background:var(--chrome-bg);color:var(--chrome-text)}
    :root[data-color-scheme="light"] .whale-fallback{filter:none;opacity:.22}
    :root[data-color-scheme="light"] .whale-mark[data-rendered="true"] .whale-fallback{opacity:0}
    :root[data-color-scheme="light"] .progress::after{background:var(--chrome-bg)}
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes whale-aura {
      0%, 100% { opacity: .28; transform: scale(.89); }
      50% { opacity: .42; transform: scale(.96); }
    }
    @media (max-width: 560px), (max-height: 560px) {
      .stage { gap: 12px; }
      .whale-mark { width: clamp(204px, min(42vw, 39vh), 244px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .stage { animation: none; }
      .whale-mark::before { animation: none; }
      .whale-fallback, .icon { transition: none; }
      .progress::before { transition: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="whale-mark" id="whaleMark" role="img" aria-label="DSH 鲸鱼粒子标识">
      <img class="whale-fallback" id="whaleFallback" src="./taskbar.png" alt="" aria-hidden="true" decoding="sync">
      <canvas class="icon" id="whaleParticles" aria-hidden="true"></canvas>
    </div>
    <div class="progress" id="startupProgress" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" hidden>
      <span id="progressValue" aria-hidden="true">0%</span>
    </div>
    <h1>DSH Codex Desktop</h1>
    <section class="status" role="status" aria-live="polite" aria-atomic="true">
      <p id="msg">正在启动</p>
    </section>
    <p id="detail" aria-hidden="true" hidden></p>
  </main>
  <script src="./whale-particles.js"></script>
</body>
</html>
